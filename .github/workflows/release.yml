name: Release

# Push a version tag (e.g. v0.1.0) to build installers for Windows, macOS, and Linux
# and upload them to a GitHub Release. Can also be run manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # produces a universal .dmg (Intel + Apple Silicon)
            args: '--target universal-apple-darwin'
          - platform: windows-latest    # produces .msi + .exe (NSIS)
            args: ''
          - platform: ubuntu-latest     # produces .deb + .AppImage
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build app + create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: '12wy-tracker ${{ github.ref_name }}'
          releaseBody: |
            Desktop installers for Windows, macOS, and Linux.

            > These builds are **unsigned**. On first launch you may see a security warning:
            > - **Windows** — SmartScreen: click *More info → Run anyway*.
            > - **macOS** — Gatekeeper: right-click the app → *Open*, then confirm.
            > - **Linux** — use the AppImage directly or install the `.deb` package.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
